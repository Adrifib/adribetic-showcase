<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;}
      .opt{fill:#fff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}
      .t{fill:#0f172a;font-weight:600}
      .s{fill:#475569;font-size:12.5px}
      .l{stroke:#64748b;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" class="t" font-size="17">Adribetic · architecture (simplified)</text>

  <rect class="box" rx="10" x="40" y="55" width="680" height="75"/>
  <text x="60" y="82" class="t">UI · screens &amp; widgets</text>
  <text x="60" y="105" class="s">Home · Statistics · Battery · Tasks · Add/Edit entry · Settings · Backup</text>

  <rect class="box" rx="10" x="40" y="165" width="680" height="75"/>
  <text x="60" y="192" class="t">State · Providers (provider package)</text>
  <text x="60" y="215" class="s">Log · Statistics · Battery · Task · Settings · LocalSync</text>

  <rect class="box" rx="10" x="40" y="275" width="330" height="75"/>
  <text x="60" y="302" class="t">Repositories</text>
  <text x="60" y="325" class="s">Log · Battery · Task · Settings</text>

  <rect class="box" rx="10" x="390" y="275" width="330" height="75"/>
  <text x="410" y="302" class="t">Services</text>
  <text x="410" y="325" class="s">Reminder planner (pure logic) · Notifications · Android widget</text>

  <rect class="box" rx="10" x="40" y="385" width="330" height="75"/>
  <text x="60" y="412" class="t">Local storage · Hive</text>
  <text x="60" y="435" class="s">Typed boxes + schema migrations</text>

  <rect class="opt" rx="10" x="390" y="385" width="330" height="75"/>
  <text x="410" y="412" class="t">Optional LAN sync</text>
  <text x="410" y="435" class="s">HTTP client → FastAPI + PostgreSQL (token-protected)</text>

  <path class="l" d="M380 130V165" marker-end="url(#a)"/>
  <path class="l" d="M205 240V275" marker-end="url(#a)"/>
  <path class="l" d="M555 240V275" marker-end="url(#a)"/>
  <path class="l" d="M205 350V385" marker-end="url(#a)"/>
  <path class="l" d="M555 350V385" marker-end="url(#a)" stroke-dasharray="6 4"/>

  <text x="380" y="495" text-anchor="middle" class="s">Offline-first: the app works fully without the server; syncing is opt-in.</text>
</svg>
